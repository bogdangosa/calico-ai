server {
    listen 80;
    server_name bogdangosa.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Nginx is waiting for Certbot...';
        add_header Content-Type text/plain;
    }
}
server {
    listen 443 ssl;
    server_name bogdangosa.com;

    ssl_certificate /etc/letsencrypt/live/bogdangosa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bogdangosa.com/privkey.pem;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}