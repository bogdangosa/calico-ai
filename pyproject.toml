[project]
name = "calico-ai"
version = "0.1.0"
description = "AI agents for the Calico board game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "loguru>=0.7.0",
    "tensorboard>=2.13.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "sqlalchemy>=2.0.50",
    "dynaconf>=3.2.13",
    "dotenv>=0.9.9",
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "stable-baselines3>=2.8.0",
    "sb3-contrib>=2.8.0",
    "gymnasium>=1.2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }